<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Trilha do Aluno</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 24px;
            font-size: 22px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .link-voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #7f8c8d;
            font-size: 14px;
            transition: color 0.3s;
        }
        .link-voltar:hover {
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cadastro de Trilha e Próximo Passo</h2>
        <form action="/trilha/salvar" method="post">
            
            <label>ID do Aluno:</label>
            <input type="number" name="aluno_id" placeholder="Ex: 1001" required>
            
            <label>Nome da Trilha:</label>
            <input type="text" name="nome_trilha" placeholder="Ex: Desenvolvimento Web" required>
            
            <label>Progresso (%):</label>
            <input type="number" step="0.01" name="progresso_pct" placeholder="Ex: 85.5" required>
            
            <label>Próximo Passo:</label>
            <input type="text" name="proximo_passo" placeholder="Ex: Estudar Java Spring" required>
            
            <button type="submit">Salvar Tudo</button>
        </form>
        <a class="link-voltar" href="/trilha/listar">Ver Trilhas Registadas &rarr;</a>
    </div>
</body>
</html>
